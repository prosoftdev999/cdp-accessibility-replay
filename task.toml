[task]
name = "afterquery/cdp-accessibility-replay"

[metadata]
author_name = "Thomas Morison"
author_email = "matiasv931026@gmail.com"
difficulty_explanation = "When a test run can't be repeated, an accessibility or front-end tooling engineer has to work from whatever the run left behind. Here that is the raw DevTools-protocol traffic of one automated Chromium session against a claims console: 1,285 time-stamped messages over two page loads. The job is to say what the accessibility tree exposed for each element at 20 points in the session, 6,815 node facts in total (ignored or not, role, name, description, ten states). The transcript is a real recording. The console app is synthetic but ordinary; it was driven in headless Chromium 153, the traffic was copied straight off the page's debugging socket, and the expected facts were read from the live page through a second session at the same points. The facts are the browser's own, so the safe way to get them is to reproduce each page state in the same build and ask it. That only works if the reproduction is right at three levels. One: the transcript is what an inspector sees, not a DOM log. A moved node returns under a new session id and its subtree stays unknown until a later setChildNodes. A style changed from script shows up only as an invalidation and then a getAttributes reply. A frame is withdrawn and announced again when it loads. Stylesheet text, adopted constructed sheets, the top layer, emulated media and the viewport all change separately. Two: some state is in no DOM event. Typed text, a native checkbox ticked from the keyboard, the option a select moved to on an arrow key, the row the pointer is resting on and the element holding focus exist only as Input commands; the :target element only as a fragment-navigation event, and one of those navigations is made by a script on a key press, with no link click behind it; a style block switched off from script only as a styleSheetRemoved event for a sheet whose owner element never left the page; and which nodes a shadow tree's slots show only as slot-distribution reports, because the status badges assign their slots by hand, so the slot names and the light-tree children say nothing about what is shown. Three: some state is in no message at all and has to come from the timestamps. Notifications and row markers get hidden, and a reminder gets shown, by CSS animations with 12 to 25 second delays, and an animation's clock starts over whenever its element is rendered again (table re-sorted, filter lifted, tab panel reopened). So a node's answer can depend on when one of its ancestors last moved. Measured against the sealed facts, with everything else right: leaving switched-off style blocks in force gets 359 nodes wrong at 16 of the 20 points (the onboarding tips never go away and the unsaved-changes panel never appears); filling slots by name 264 nodes at 9 points (once the rows are compacted the badges stop showing their detail, which then comes out exposed, and the status cells pick up its text); skipping the fragment navigation that no click explains 110 nodes at 5 points (the shortcuts panel stays hidden); ignoring the clock 28 nodes at 10 points; dropping pointer moves 10 nodes at 5 points; dropping the Tab, Space and arrow keys 9 nodes at 8 points. None of these shows up in a comparison of the DOM tree, because the tree is the same either way. Twelve accessibility replies from spot checks are in the transcript. One shows an expired notification as not visible; the rest say nothing about timing."
solution_explanation = "solution/solve.py reads /app/data/transcript.jsonl and /app/data/audit_points.json, nothing else, and replays the session into one live page in the installed Chromium. On each DOM.getDocument reply it sends the page to the recorded address. That request gets a bare document with the recorded doctype; linked stylesheets get the text seen in getStyleSheetText replies; any other navigation gets a 204 and everything else is blocked. If a navigation left over from a replayed click cancels that load, it is tried again. page_replay.js then builds the document from the reply with DOM calls. From there each message is applied in order. DOM events turn into DOM operations on the live nodes: inserts, removals, attribute and text changes, setChildNodes, shadow roots in their recorded mode with every slot assigned by hand from the reported distribution, template contents, frame documents after the frame loads, SVG elements and xlink attributes in their namespaces. A node that comes back with a new node id but a backend id we already know is the same live node being moved. getAttributes replies overwrite an element's attributes, getStyleSheetText replies update constructed sheets, adoptedStyleSheetsModified sets the adopted list (a sheet named there before its text has arrived is created empty and filled when the text comes), getTopLayerElements replies are matched with showModal(), close(), showPopover() and hidePopover(), fragment navigations set the hash when the page's own handling of a replayed click has not already done so, and a style or link element's sheet is disabled while none of its sheet ids is in the active set and enabled again when one is. Input and Emulation commands are sent again as recorded, so the browser does the typing, ticking, focusing, hovering and popover toggling itself, and it also builds its own internal shadow trees. Time comes from the transcript and not from how fast the replay runs. Each animation is paused the moment it appears and tagged with the t_ms of the burst of messages that created it; at an audit point it is moved to the audit time minus that tag. The run aborts if an animation is within 1.5 seconds of a change between the audit point's message and the next one, if an event refers to a node nobody described, or if an accessibility reply recorded at an audit point doesn't come out the same. At each audit point the backend ids are mapped to live nodes, Accessibility.getPartialAXTree is called with fetchRelatives false, and report.py keeps the requested fields. It runs in about 25 seconds."
verification_explanation = "The verifier has its own container and only parses /app/output/ax_audit.json as JSON (it must be a regular file under a size cap). It runs nothing the agent wrote. The sealed facts are in tests/expected.json and they do not come from the reference solution. They were read off the live page with Accessibility.getPartialAXTree, through a second debugging session that was not recorded, while the transcript was being captured: every element of the main document, framed documents and author shadow trees at each of the 20 points. The reference solution gets all 6,815 of them back from the transcript alone, which is how we know the transcript pins them down. It also asserts that no audit point is within 1.5 seconds of a timed change, so there is no doubt about which moment a point means. There are six tests: every listed node present, the ignored flag, role, name, description, and the ten states. Names and descriptions go through Unicode NFC, whitespace collapsing and trimming before comparison. State values are compared as lower-cased text, so true equals \"true\". Roles must match exactly. Key order, extra keys and extra state properties are ignored, and for an ignored node only the flag is looked at. A failing test prints the count of wrong nodes per audit point and the first few ids. test.sh writes reward 0 up front and 1 only when all tests pass, and writes a CTRF report. Run against the built images: the reference gets 1; a missing, empty, truncated, all-ignored or partial file gets 0; so does one wrong name; so does each of the six shortcuts measured in the difficulty explanation (9 to 359 nodes wrong)."
category = "Software"
subcategory = "Frontend"
tags = ["accessibility", "devtools-protocol", "dom", "chromium", "playwright"]
expert_time_estimate_hours = 4.0
relevant_experience = "For this task I wrote a recorder that drives headless Chromium over a raw DevTools-protocol socket and tracks the page the way an inspector does, a second-session harness that reads every element's accessibility node at chosen moments, and two separate reproductions of the recorded page (rebuild per state, and live replay). I found the fidelity problems described above by diffing those reproductions against the live browser node by node, including the places where the DOM and CSS domains under-report a change and where animation clocks restart."

